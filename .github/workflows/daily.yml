name: daily-mail

# 매일 06:30 KST (UTC 21:30). 예약 실행은 늦어질 수 있어 7시보다 30분 당겨 둔다.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 보낸 공고 기록은 공개 저장소에 커밋하지 않고 Actions 캐시에 둔다
      - name: 보낸 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      # 검색 기준도 Secret 으로 넘긴다: Variable 은 공개 로그의 env 블록에 평문으로 찍힌다
      - name: 수집 · 메일 발송
        run: python run.py
        env:
          JOBCATCH_CONFIG: ${{ secrets.JOBCATCH_CONFIG }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}

      - name: 보낸 기록 저장
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
