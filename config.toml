# Job-Catch 검색 조건
# 아래 값은 첫 시험용 예시입니다. 원하는 직무·지역·경력으로 바꿔 주세요.

[run]
max_pages = 2        # 검색 조건 하나당 읽을 페이지 수 (1페이지 = 40건)
delay_sec = 2.0      # 요청 사이 대기 시간(초)

# 검색 조건은 여러 개 둘 수 있습니다. [[saramin]] 블록을 복사해서 추가하세요.
[[saramin]]
keyword = "개발자"
exp_cd = "1"                 # 경력: 1=신입, 2=경력, "1,2"=둘 다
loc_mcd = "101000,102000"    # 지역: 101000=서울, 102000=경기, 108000=인천

[filter]
include_any = []                                   # 하나라도 들어가야 하는 단어 (비우면 전부 통과)
exclude_words = ["영업", "텔레마케팅", "강사"]       # 제목·회사·직무에 있으면 제외
exclude_companies = []                             # 제외할 회사 이름
exclude_employment = ["파견직", "프리랜서"]          # 제외할 고용형태
